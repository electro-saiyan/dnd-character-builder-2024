<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&amp;D 2024 Character Builder</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><a href="#home" class="home-title">Character Builder <span class="edition">2024</span></a></h1>
    <div class="topbar-actions">
      <button type="button" id="btn-export">Export JSON</button>
      <label class="button">Import JSON<input type="file" id="btn-import" accept="application/json,.json" hidden></label>
      <button type="button" id="btn-new" class="danger">New character</button>
    </div>
  </header>
  <div class="layout">
    <nav id="steps" class="steps" aria-label="Steps"></nav>
    <main id="step" class="step"></main>
    <aside id="summary" class="summary" aria-label="Character summary"></aside>
  </div>
  <footer class="attribution">
    Personal, non-commercial tool. Rules data summarized from the 2024 Player's Handbook via dnd2024.wikidot.com;
    feature text is paraphrased. Dungeons &amp; Dragons is a trademark of Wizards of the Coast.
  </footer>
</body>
</html>
